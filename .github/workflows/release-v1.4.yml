name: Release M300Boot 1.4
on:
  push:
    branches: [main]
    paths:
      - 'firmware/v1.4/**'
      - '.github/workflows/release-v1.4.yml'
      - 'RELEASE_NOTES_v1.4.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-m300boot-v1.4
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'MarcinKowalik-AGH/Zortrax-m300-Boot-Loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all tracked publication checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Validate current and archived releases without device access
        run: python tools/validate_publication.py --json
      - name: Verify 1.4 release assets
        working-directory: firmware/v1.4
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish immutable assets and refresh current documentation links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.4 >/dev/null 2>&1; then
            gh release edit v1.4 --title 'M300Boot 1.4' --notes-file RELEASE_NOTES_v1.4.md
            echo 'Updated release notes only; existing tag and assets preserved.'
            exit 0
          fi
          gh release create v1.4 \
            firmware/v1.4/M300Boot_v1.4_SD_FACTORY_OEMV3.zip \
            firmware/v1.4/M300Boot_v1.4_SD_UPGRADE.zip \
            firmware/v1.4/M300Boot_v1.4_STLINK.zip \
            firmware/v1.4/M300_BACKUP_0.5.5_UART.zip \
            firmware/v1.4/SHA256SUMS.txt \
            firmware/v1.4/RELEASE_MANIFEST.json \
            --target "$GITHUB_SHA" \
            --title 'M300Boot 1.4' \
            --notes-file RELEASE_NOTES_v1.4.md \
            --latest
